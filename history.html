<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>历史记录 — 智能合同审查</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; background: #f5f5f5; color: #262626; font-size: 15px; line-height: 1.6; }
    a { text-decoration: none; }
  </style>
</head>
<body>
  <script>
    (function() { if (!localStorage.getItem('auth_user')) location.href = 'index.html' })()
    function getAuthUser() { try { return JSON.parse(localStorage.getItem('auth_user')) } catch(e) { return null } }
    function handleLogout() { localStorage.removeItem('auth_user'); location.href = 'index.html' }
    function navTo(path) { location.href = path }
  </script>

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 lg:px-8 sticky top-0 z-50">
    <div class="flex items-center gap-10">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navTo('dashboard.html')">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-[#1677ff] to-[#4096ff] flex items-center justify-center text-white text-sm font-bold shadow-sm">
          <i class="fa-regular fa-file-lines" style="font-size:16px"></i>
        </div>
        <span class="font-semibold text-base text-gray-900">智能合同审查</span>
      </div>
      <nav class="flex items-center gap-1">
        <button onclick="navTo('dashboard.html')" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm transition-colors duration-200 text-gray-500 hover:text-gray-700 hover:bg-gray-50">
          <i class="fa-solid fa-house"></i> 工作台
        </button>
        <button onclick="navTo('review-list.html')" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm transition-colors duration-200 text-gray-500 hover:text-gray-700 hover:bg-gray-50">
          <i class="fa-regular fa-file-lines"></i> 合同审查
        </button>
        <button onclick="navTo('history.html')" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm transition-colors duration-200 text-[#1677ff] font-semibold bg-blue-50">
          <i class="fa-regular fa-clock"></i> 历史记录
        </button>
      </nav>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2.5 text-sm text-gray-500">
        <div id="userAvatar" class="w-8 h-8 rounded-full bg-[#1677ff] flex items-center justify-center text-white text-xs font-semibold">U</div>
        <span id="userName" class="text-sm text-gray-600">用户</span>
      </div>
      <button onclick="handleLogout()" class="flex items-center gap-1.5 text-xs text-gray-400 hover:text-red-500 transition-colors px-2.5 py-1.5 rounded hover:bg-red-50">
        <i class="fa-solid fa-right-from-bracket"></i> 退出
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-6 lg:px-8 py-6 lg:py-8">
    <div>
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">审查历史记录</h1>
          <p class="text-base text-gray-500 mt-1">查看合同审查的历史记录与操作日志</p>
        </div>
        <button class="flex items-center gap-1.5 px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-50 transition-colors">
          <i class="fa-regular fa-download"></i> 导出记录
        </button>
      </div>

      <!-- Filters -->
      <div class="bg-white rounded-xl border border-gray-100 p-4 mb-5">
        <div class="flex items-center gap-4 flex-wrap">
          <div class="relative flex-1 min-w-[200px]">
            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
            <input type="text" id="searchInput" placeholder="搜索合同名称、编号..." class="w-full pl-9 pr-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#1677ff] focus:ring-1 focus:ring-[#1677ff]/20">
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 mb-1">开始日期</label>
            <input type="date" id="startDate" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#1677ff]">
          </div>
          <div>
            <label class="block text-[10px] text-gray-400 mb-1">结束日期</label>
            <input type="date" id="endDate" class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-[#1677ff]">
          </div>
          <div class="pt-4">
            <select id="statusFilter" class="border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-500 focus:outline-none focus:border-[#1677ff]"></select>
          </div>
          <button id="queryBtn" class="pt-4 px-5 py-2 bg-[#1677ff] text-white rounded-lg text-sm font-medium hover:bg-[#0958d9] transition-colors">查询</button>
        </div>
      </div>

      <!-- Stats -->
      <div id="statsRow" class="grid grid-cols-5 gap-3 mb-5"></div>

      <!-- Timeline -->
      <div class="bg-white rounded-xl border border-gray-100 overflow-hidden mb-5">
        <div class="px-5 py-3.5 border-b border-gray-100 bg-gray-50 flex items-center gap-2">
          <i class="fa-regular fa-clock text-[#1677ff] text-sm"></i>
          <span class="text-sm font-semibold text-gray-700">审查动态</span>
        </div>
        <div id="timelineBody" class="px-5 py-4"></div>
      </div>

      <!-- Detail Table -->
      <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
        <div class="px-5 py-3.5 border-b border-gray-100 bg-gray-50 flex items-center gap-2">
          <i class="fa-regular fa-rectangle-list text-[#1677ff] text-sm"></i>
          <span class="text-sm font-semibold text-gray-700">详细记录</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-gray-50 text-left text-xs text-gray-500 uppercase tracking-wider">
                <th class="px-4 py-3.5 font-medium">合同名称</th>
                <th class="px-4 py-3.5 font-medium">类型</th>
                <th class="px-4 py-3.5 font-medium">评分</th>
                <th class="px-4 py-3.5 font-medium">发现问题</th>
                <th class="px-4 py-3.5 font-medium">审查人</th>
                <th class="px-4 py-3.5 font-medium">审查时间</th>
                <th class="px-4 py-3.5 font-medium">状态</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-gray-100 text-gray-600"></tbody>
          </table>
        </div>
        <div id="tableFooter" class="flex items-center justify-between px-4 py-3 border-t border-gray-100 bg-gray-50"></div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 border-t border-gray-100 bg-white">
    <span class="text-xs text-gray-400">智能合同审查系统 &copy; 2026</span>
  </footer>

    if (u) { document.getElementById('userName').textContent = u.name; document.getElementById('userAvatar').textContent = u.name[0] }

      { id: 16, name: '知识产权转让协议', type: '知识产权', score: 81, issues: '2 项', reviewer: 'AI 自动审查', time: '2026-05-09 10:00', status: '已完成', statusClass: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-600' },
      { id: 17, name: '股权投资意向书', type: '投资合同', score: 62, issues: '8 项', reviewer: 'AI 自动审查', time: '2026-05-08 15:40', status: '法务复核', statusClass: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-50 text-red-600' },
      { id: 18, name: '云计算服务等级协议', type: '服务合同', score: 87, issues: '2 项', reviewer: 'AI 自动审查', time: '2026-05-08 11:15', status: '已完成', statusClass: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-600' },
      { id: 19, name: '供应链金融合作协议', type: '金融合同', score: 74, issues: '4 项', reviewer: 'AI 自动审查', time: '2026-05-08 09:00', status: '待复核', statusClass: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-yellow-50 text-yellow-600' },
      { id: 20, name: '跨境电商代运营合同', type: '服务合同', score: null, issues: '--', reviewer: '--', time: '2026-05-07 17:30', status: '待审查', statusClass: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-gray-100 text-gray-500' },
      { id: 21, name: '产学研合作框架协议', type: '合作协议', score: 83, issues: '3 项', reviewer: 'AI 自动审查', time: '2026-05-07 14:00', status: '已完成', statusClass: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-600' },
      { id: 22, name: '渠道代理销售合同', type: '销售合同', score: 70, issues: '5 项', reviewer: 'AI 自动审查', time: '2026-05-07 10:30', status: '待复核', statusClass: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-yellow-50 text-yellow-600' },
      { id: 23, name: '企业并购法律尽职调查合同', type: '服务合同', score: 91, issues: '1 项', reviewer: 'AI 自动审查', time: '2026-05-06 16:00', status: '已完成', statusClass: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-600' },
      { id: 24, name: '数据中心机房租赁合同', type: '租赁合同', score: 66, issues: '6 项', reviewer: 'AI 自动审查', time: '2026-05-06 13:15', status: '法务复核', statusClass: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-50 text-red-600' },
      { id: 25, name: '战略合作框架备忘录', type: '备忘录', score: 85, issues: '2 项', reviewer: 'AI 自动审查', time: '2026-05-06 09:45', status: '已完成', statusClass: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-600' },
    ]

    const timeline = [
      { date: '今日', items: [
        { title: '设备采购框架协议', status: '已完成审查', dotColor: 'bg-blue-500', time: '09:30', desc: '综合评分 76，发现 5 项问题（2 高 1 中 2 低）' },
      ]},
      { date: '昨日', items: [
        { title: 'IT 运维服务合同', status: '已完成审查', dotColor: 'bg-green-500', time: '15:20', desc: '综合评分 88，发现 2 项问题（0 高 1 中 1 低）' },
        { title: '原材料供货框架协议', status: '审查中', dotColor: 'bg-yellow-500', time: '11:05', desc: 'AI 正在分析合同条款，预计 3 分钟内完成' },
        { title: '办公楼租赁协议', status: '发现风险', dotColor: 'bg-red-500', time: '09:45', desc: '综合评分 58，发现 7 项问题（3 高 2 中 2 低），建议法务复核' },
      ]},
      { date: '本周', items: [
        { title: '软件开发外包服务合同', status: '待审查', dotColor: 'bg-gray-400', time: '05-12', desc: '等待 AI 审查队列处理' },
        { title: '年度审计服务协议', status: '已完成审查', dotColor: 'bg-green-500', time: '05-12', desc: '综合评分 92，发现 1 项问题（0 高 0 中 1 低）' },
        { title: '数据中心托管服务合同', status: '已完成审查', dotColor: 'bg-blue-500', time: '05-12', desc: '综合评分 71，发现 4 项问题（1 高 2 中 1 低）' },
        { title: '品牌授权使用协议', status: '已完成审查', dotColor: 'bg-green-500', time: '05-11', desc: '综合评分 84，发现 3 项问题（1 高 1 中 1 低）' },
        { title: '物流配送服务合同', status: '发现风险', dotColor: 'bg-red-500', time: '05-11', desc: '综合评分 65，发现 6 项问题（2 高 2 中 2 低）' },
      ]},
    ]

    const pageSize = 8
    let page = 1
    let keyword = ''
    let statusFilter = '全部状态'
    let startDate = ''
    let endDate = ''

    const statusOptions = ['全部状态', ...new Set(allRecords.map(r => r.status))]
    const statusEl = document.getElementById('statusFilter')
    statusOptions.forEach(s => { const o = document.createElement('option'); o.textContent = s; statusEl.appendChild(o) })

    function getScoreColor(s) {
      if (s == null) return 'text-gray-400'
      if (s >= 80) return 'text-green-500'
      if (s >= 60) return 'text-yellow-500'
      return 'text-red-500'
    }

    function getFiltered() {
      let list = allRecords
      if (keyword.trim()) { const kw = keyword.toLowerCase(); list = list.filter(r => r.name.toLowerCase().includes(kw)) }
      if (statusFilter !== '全部状态') list = list.filter(r => r.status === statusFilter)
      if (startDate) list = list.filter(r => r.time >= startDate)
      if (endDate) list = list.filter(r => r.time <= endDate + ' 23:59')
      return list
    }

    function renderStats(filtered) {
      const todayCount = filtered.filter(r => r.time.startsWith('2026-05-14')).length || '12'
      const weekCount = filtered.filter(r => r.time >= '2026-05-11').length || '67'
      const issueCount = filtered.reduce((s, r) => s + (r.issues !== '--' ? parseInt(r.issues) : 0), 0) || '328'
      document.getElementById('statsRow').innerHTML = [
        { label: '今日审查', value: todayCount, color: 'text-gray-800' },
        { label: '本周审查', value: weekCount, color: 'text-gray-800' },
        { label: '本月审查', value: filtered.length, color: 'text-gray-800' },
        { label: '累计审查', value: '1,847', color: 'text-gray-800' },
        { label: '发现问题', value: issueCount, color: 'text-red-500' },
      ].map(s => '<div class="bg-white rounded-xl border border-gray-100 p-4 text-center"><p class="text-xs text-gray-500">'+s.label+'</p><p class="text-xl font-bold mt-1 '+s.color+'">'+s.value+'</p></div>').join('')
    }

    function renderTimeline() {
      document.getElementById('timelineBody').innerHTML = timeline.map(g => '<div><p class="text-[10px] text-gray-400 font-medium mb-2 tracking-wider">'+g.date+'</p>'+
        g.items.map((item, i) => {
          const isLast = i === g.items.length - 1
          return '<div class="flex gap-4 pb-3 relative"><div class="flex flex-col items-center"><div class="w-2.5 h-2.5 rounded-full '+item.dotColor+' mt-1.5"></div>'+(isLast?'':'<div class="w-px flex-1 bg-gray-200 mt-1"></div>')+'</div><div class="flex-1 min-w-0 pb-1"><div class="flex items-center justify-between"><p class="text-sm font-medium text-gray-800 truncate">'+item.title+'<span class="text-xs text-gray-400 ml-2 font-normal">'+item.status+'</span></p><span class="text-xs text-gray-400 whitespace-nowrap ml-2">'+item.time+'</span></div><p class="text-xs text-gray-500 mt-0.5">'+item.desc+'</p></div></div>'
        }).join('')+'</div>').join('')
    }

    function renderPagination(filtered) {
      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize))
      const safePage = Math.min(page, totalPages)
      const pages = []
      if (totalPages <= 7) { for (let i = 1; i <= totalPages; i++) pages.push(i) }
      else {
        pages.push(1)
        if (safePage > 3) pages.push('...')
        for (let i = Math.max(2, safePage - 1); i <= Math.min(totalPages - 1, safePage + 1); i++) pages.push(i)
        if (safePage < totalPages - 2) pages.push('...')
        pages.push(totalPages)
      }
      document.getElementById('tableFooter').innerHTML = '<span class="text-xs text-gray-400">共 '+filtered.length+' 条记录</span><div class="flex items-center gap-1">'+
        '<button onclick="goPage('+(safePage-1)+')" '+(safePage===1?'disabled':'')+' class="px-2.5 py-1.5 text-xs border border-gray-200 rounded bg-white text-gray-500 disabled:opacity-30 disabled:cursor-not-allowed hover:border-gray-300"><i class="fa-solid fa-chevron-left"></i></button>'+
        pages.map(p => p === '...' ? '<span class="px-1 text-xs text-gray-400">...</span>' : '<button onclick="goPage('+p+')" class="px-3 py-1.5 text-xs border rounded font-medium transition-colors '+(p===safePage?'border-[#1677ff] bg-blue-50 text-[#1677ff]':'border-gray-200 bg-white text-gray-600 hover:border-gray-300')+'">'+p+'</button>').join('')+
        '<button onclick="goPage('+(safePage+1)+')" '+(safePage===totalPages?'disabled':'')+' class="px-2.5 py-1.5 text-xs border border-gray-200 rounded bg-white text-gray-500 disabled:opacity-30 disabled:cursor-not-allowed hover:border-gray-300"><i class="fa-solid fa-chevron-right"></i></button></div>'
    }

    function renderTable() {
      const filtered = getFiltered()
      renderStats(filtered)
      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize))
      const safePage = Math.min(page, totalPages)
      renderPagination(filtered)
      const paged = filtered.slice((safePage - 1) * pageSize, safePage * pageSize)
      const tbody = document.getElementById('tableBody')
      if (paged.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-12 text-center text-sm text-gray-400">暂无匹配的记录</td></tr>'
      } else {
        tbody.innerHTML = paged.map(r => '<tr class="hover:bg-gray-50 transition-colors"><td class="px-4 py-3.5 font-medium text-gray-800 text-sm">'+r.name+'</td><td class="px-4 py-3.5 text-sm">'+r.type+'</td><td class="px-4 py-3.5"><span class="font-semibold text-sm '+getScoreColor(r.score)+'">'+(r.score??'--')+'</span></td><td class="px-4 py-3.5 text-sm">'+r.issues+'</td><td class="px-4 py-3.5 text-sm">'+r.reviewer+'</td><td class="px-4 py-3.5 text-xs text-gray-400">'+r.time+'</td><td class="px-4 py-3.5"><span class="'+r.statusClass+'">'+r.status+'</span></td></tr>').join('')
      }
    }

    function goPage(n) {
      const filtered = getFiltered()
      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize))
      page = Math.max(1, Math.min(n, totalPages))
      renderTable()
    }

    function doQuery() {
      keyword = document.getElementById('searchInput').value
      startDate = document.getElementById('startDate').value
      endDate = document.getElementById('endDate').value
      statusFilter = document.getElementById('statusFilter').value
      page = 1
      renderTable()
    }

    document.getElementById('searchInput').addEventListener('input', doQuery)
    document.getElementById('startDate').addEventListener('change', doQuery)
    document.getElementById('endDate').addEventListener('change', doQuery)
    document.getElementById('statusFilter').addEventListener('change', doQuery)
    document.getElementById('queryBtn').addEventListener('click', doQuery)

    renderTimeline()
    renderTable()
  </script>
</body>
</html>
