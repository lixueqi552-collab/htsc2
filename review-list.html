<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合同审查 — AI合同审查系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.2.0/build/index.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; background: #f5f5f5; color: #262626; font-size: 15px; line-height: 1.6; }
    a { text-decoration: none; }
  </style>
</head>
<body>
  <script>
    (function() { if (!localStorage.getItem('auth_user')) location.href = 'index.html' })()
    function getAuthUser() { try { return JSON.parse(localStorage.getItem('auth_user')) } catch(e) { return null } }
    function handleLogout() { localStorage.removeItem('auth_user'); location.href = 'index.html' }
    function navTo(path) { location.href = path }
  </script>

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 h-[72px] flex items-center justify-between px-8 lg:px-10 sticky top-0 z-50">
    <div class="flex items-center gap-10">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navTo('dashboard.html')">
        <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-[#1677ff] to-[#4096ff] flex items-center justify-center text-white text-[15px] font-bold shadow-sm">
          <i class="fa-regular fa-file-lines" style="font-size:18px"></i>
        </div>
        <span class="font-semibold text-base text-gray-900">AI合同审查系统</span>
      </div>
      <nav class="flex items-center gap-1">
        <button onclick="navTo('dashboard.html')" class="flex items-center gap-2 px-5 py-2.5 rounded-lg text-[15px] transition-colors duration-200 text-gray-500 hover:text-gray-700 hover:bg-gray-50">
          <i class="fa-solid fa-house"></i> 工作台
        </button>
        <button onclick="navTo('review-list.html')" class="flex items-center gap-2 px-5 py-2.5 rounded-lg text-[15px] transition-colors duration-200 text-[#1677ff] font-semibold bg-blue-50">
          <i class="fa-regular fa-file-lines"></i> 合同审查
        </button>
        <button onclick="navTo('history.html')" class="flex items-center gap-2 px-5 py-2.5 rounded-lg text-[15px] transition-colors duration-200 text-gray-500 hover:text-gray-700 hover:bg-gray-50">
          <i class="fa-regular fa-clock"></i> 历史记录
        </button>
      </nav>
    </div>
    <div class="relative group">
      <div class="flex items-center gap-2.5 text-sm text-gray-500 cursor-pointer select-none">
        <div id="userAvatar" class="w-8 h-8 rounded-full bg-[#1677ff] flex items-center justify-center text-white text-xs font-semibold">U</div>
        <span id="userName" class="text-sm text-gray-600">用户</span>
        <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
      </div>
      <div class="absolute right-0 top-full mt-1 w-40 bg-white rounded-lg shadow-lg border border-gray-100 hidden group-hover:block z-10 overflow-hidden">
        <button onclick="navTo('profile.html')" class="w-full text-left px-4 py-2.5 text-sm text-gray-700 hover:bg-gray-50 flex items-center gap-2 border-b border-gray-50"><i class="fa-regular fa-user" style="color:#1677ff"></i> 个人中心</button>
        <button onclick="handleLogout()" class="w-full text-left px-4 py-2.5 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2"><i class="fa-solid fa-right-from-bracket"></i> 退出</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-[90rem] mx-auto w-full px-8 lg:px-10 py-6 lg:py-8">
    <div>
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">合同审查列表</h1>
          <p class="text-base text-gray-500 mt-1">管理所有合同审查任务，查看审查报告</p>
        </div>
        <button onclick="navTo('review.html')" class="bg-[#1677ff] text-white px-6 py-3 rounded-lg font-semibold text-base hover:bg-[#0958d9] transition-colors flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-upload"></i> 上传文档
        </button>
      </div>

      <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
        <div class="p-4 border-b border-gray-100 flex items-center justify-between">
          <div class="relative w-80">
            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="搜索文档名称..." class="w-full pl-9 pr-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#1677ff] focus:ring-1 focus:ring-[#1677ff]/20">
          </div>
          <span id="totalCount" class="text-sm text-gray-400">共 8 条记录</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-gray-50 text-left">
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500 w-[130px]">合同编号</th>
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500">合同名称</th>
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500 w-[90px]">合同类型</th>
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500 w-[100px]">合同金额</th>
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500 w-[80px]">审查立场</th>
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500 w-[80px]">创建人</th>
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500 w-[140px]">上传时间</th>
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500 w-[180px]">操作</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-gray-50"></tbody>
          </table>
        </div>

        <div id="tableFooter" class="flex items-center justify-between px-4 py-3 border-t border-gray-100" style="display:none"></div>
      </div>
    </div>
  </main>

  <!-- Export Modal -->
  <div id="exportModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" style="display:none" onclick="closeExportModal()">
    <div class="bg-white rounded-xl max-w-md w-full mx-4 shadow-xl" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-5 py-3.5 border-b border-gray-100">
        <span class="text-sm font-semibold text-gray-800 flex items-center gap-1.5"><i class="fa-solid fa-download text-[#1677ff]"></i> 导出审查报告</span>
        <button onclick="closeExportModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-5">
        <p class="text-sm text-gray-500 mb-4">请选择导出格式：</p>
        <div class="space-y-3">
          <!-- 原始文档 -->
          <label class="flex items-start gap-3 p-3 rounded-lg border-2 border-gray-100 hover:border-[#1677ff] cursor-pointer transition-colors group">
            <input type="radio" name="exportFormat" value="original" class="mt-1" checked>
            <div class="flex-1">
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center">
                  <i class="fa-solid fa-file-word text-blue-500"></i>
                </div>
                <span class="text-sm font-medium text-gray-800">原始文档</span>
              </div>
              <p class="text-xs text-gray-400 mt-1 ml-10">导出原始合同文件，保持原有格式</p>
            </div>
          </label>
          <!-- 批注版 -->
          <label class="flex items-start gap-3 p-3 rounded-lg border-2 border-gray-100 hover:border-[#1677ff] cursor-pointer transition-colors group">
            <input type="radio" name="exportFormat" value="annotated" class="mt-1">
            <div class="flex-1">
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-yellow-50 flex items-center justify-center">
                  <i class="fa-solid fa-file-pen text-yellow-500"></i>
                </div>
                <span class="text-sm font-medium text-gray-800">批注版文档</span>
              </div>
              <p class="text-xs text-gray-400 mt-1 ml-10">在原文中嵌入审查批注，便于对照查看</p>
            </div>
          </label>
          <!-- 审查意见书 -->
          <label class="flex items-start gap-3 p-3 rounded-lg border-2 border-gray-100 hover:border-[#1677ff] cursor-pointer transition-colors group">
            <input type="radio" name="exportFormat" value="report" class="mt-1">
            <div class="flex-1">
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-green-50 flex items-center justify-center">
                  <i class="fa-solid fa-file-lines text-green-500"></i>
                </div>
                <span class="text-sm font-medium text-gray-800">审查意见书</span>
              </div>
              <p class="text-xs text-gray-400 mt-1 ml-10">独立的审查报告，包含风险分析与建议</p>
            </div>
          </label>
        </div>
      </div>
      <div class="flex items-center justify-end gap-3 px-5 py-3.5 border-t border-gray-100">
        <button onclick="closeExportModal()" class="border border-gray-200 text-gray-600 px-5 py-2 rounded-lg text-sm font-medium hover:border-gray-300 transition-colors">取消</button>
        <button onclick="doExport()" class="bg-[#1677ff] text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-[#0958d9] transition-colors flex items-center gap-1.5"><i class="fa-solid fa-download"></i> 导出</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center py-4 border-t border-gray-100 bg-white">
    <span class="text-xs text-gray-400">智能合同审查系统 &copy; 2026</span>
  </footer>

  <script>
    var u = getAuthUser()
    if (u) { document.getElementById('userName').textContent = u.name; document.getElementById('userAvatar').textContent = u.name[0] }

    const mockData = [
      { id: 'CT-2026-001', name: '设备采购框架协议', type: '采购合同', amount: '5,000,000', stance: '甲方', risk: 'low', creator: '张明', time: '2026-05-14 09:30', score: 88 },
      { id: 'CT-2026-002', name: 'IT运维服务合同', type: '服务合同', amount: '800,000', stance: '甲方', risk: 'medium', creator: '李华', time: '2026-05-14 10:15', score: 72 },
      { id: 'CT-2026-003', name: '保密协议', type: '保密协议', amount: '-', stance: '乙方', risk: 'low', creator: '张明', time: '2026-05-13 16:45', score: 90 },
      { id: 'CT-2026-004', name: '办公楼租赁协议', type: '租赁合同', amount: '1,200,000/年', stance: '乙方', risk: 'high', creator: '王磊', time: '2026-05-13 14:20', score: 58 },
      { id: 'CT-2026-005', name: '软件许可及服务协议', type: '许可合同', amount: '350,000', stance: '甲方', risk: 'low', creator: '李华', time: '2026-05-12 11:00', score: 92 },
      { id: 'CT-2026-006', name: '货物运输合同', type: '运输合同', amount: '200,000', stance: '甲方', risk: 'medium', creator: '张明', time: '2026-05-11 15:30', score: 75 },
      { id: 'CT-2026-007', name: '技术服务合同', type: '服务合同', amount: '600,000', stance: '乙方', risk: 'low', creator: '赵丽', time: '2026-05-10 09:00', score: 85 },
      { id: 'CT-2026-008', name: '年度采购框架协议', type: '采购合同', amount: '12,000,000', stance: '甲方', risk: 'medium', creator: '王磊', time: '2026-05-09 13:45', score: 70 },
    ]

    const riskConfig = {
      high: { label: '高风险', class: 'inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-red-50 text-red-600', icon: '<i class="fa-solid fa-triangle-exclamation"></i>' },
      medium: { label: '一般风险', class: 'inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-yellow-50 text-yellow-600', icon: '<i class="fa-solid fa-circle-exclamation"></i>' },
      low: { label: '低风险', class: 'inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-600', icon: '<i class="fa-solid fa-circle-check"></i>' },
    }

    const stanceColors = {
      '甲方': 'bg-blue-50 text-blue-600',
      '乙方': 'bg-green-50 text-green-600',
      '丙方': 'bg-purple-50 text-purple-600',
    }

    const perPage = 6
    let page = 1
    let search = ''

    function render() {
      const kw = search.toLowerCase()
      const filtered = mockData.filter(r => r.name.toLowerCase().includes(kw) || r.id.toLowerCase().includes(kw) || r.type.toLowerCase().includes(kw))
      const totalPages = Math.ceil(filtered.length / perPage)
      const safePage = Math.min(page, Math.max(1, totalPages))
      const paged = filtered.slice((safePage - 1) * perPage, safePage * perPage)

      document.getElementById('totalCount').textContent = '共 ' + filtered.length + ' 条记录'

      const tbody = document.getElementById('tableBody')
      if (paged.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="py-12 text-center text-sm text-gray-400">暂无数据</td></tr>'
      } else {
        tbody.innerHTML = paged.map(r => {
          const risk = riskConfig[r.risk]
          const stanceClass = stanceColors[r.stance] || 'bg-gray-50 text-gray-600'
          return `<tr class="hover:bg-gray-50 transition-colors">
            <td class="py-3.5 px-4 text-sm text-gray-600 font-mono">${r.id}</td>
            <td class="py-3.5 px-4"><span class="text-sm text-gray-800 font-medium">${r.name}</span></td>
            <td class="py-3.5 px-4 text-sm text-gray-500">${r.type}</td>
            <td class="py-3.5 px-4 text-sm text-gray-600 font-medium">${r.amount === '-' ? '-' : '¥' + r.amount}</td>
            <td class="py-3.5 px-4"><span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${stanceClass}">${r.stance}</span></td>
            <td class="py-3.5 px-4 text-sm text-gray-500">${r.creator}</td>
            <td class="py-3.5 px-4 text-sm text-gray-400">${r.time}</td>
            <td class="py-3.5 px-4">
              <div class="flex items-center gap-1">
                <button onclick="navTo('review.html?report=1')" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-[#1677ff] hover:bg-blue-50 transition-colors"><i class="fa-solid fa-eye"></i> 查看</button>
                <button onclick="openExportModal('${r.id}')" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-gray-600 hover:bg-gray-100 transition-colors"><i class="fa-solid fa-download"></i> 导出</button>
                <button onclick="deleteItem('${r.id}')" class="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-gray-400 hover:text-red-500 hover:bg-red-50 transition-colors"><i class="fa-solid fa-trash-can"></i></button>
              </div>
            </td>
          </tr>`
        }).join('')
      }

      const footer = document.getElementById('tableFooter')
      if (totalPages > 1) {
        footer.style.display = ''
        footer.innerHTML = `
          <span class="text-xs text-gray-400">第 ${safePage}/${totalPages} 页</span>
          <div class="flex items-center gap-1">
            <button onclick="goPage(${safePage - 1})" ${safePage === 1 ? 'disabled' : ''} class="p-1.5 rounded border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-30 disabled:cursor-not-allowed"><i class="fa-solid fa-chevron-left" style="font-size:12px"></i></button>
            ${Array.from({length: totalPages}, (_, i) => i + 1).map(p =>
              `<button onclick="goPage(${p})" class="w-7 h-7 rounded text-xs font-medium ${p === safePage ? 'bg-[#1677ff] text-white' : 'text-gray-500 hover:bg-gray-100'}">${p}</button>`
            ).join('')}
            <button onclick="goPage(${safePage + 1})" ${safePage === totalPages ? 'disabled' : ''} class="p-1.5 rounded border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-30 disabled:cursor-not-allowed"><i class="fa-solid fa-chevron-right" style="font-size:12px"></i></button>
          </div>`
      } else {
        footer.style.display = 'none'
      }
    }

    function goPage(n) {
      const filtered = mockData.filter(r => r.name.toLowerCase().includes(search.toLowerCase()) || r.id.toLowerCase().includes(search.toLowerCase()) || r.type.toLowerCase().includes(search.toLowerCase()))
      const totalPages = Math.ceil(filtered.length / perPage)
      page = Math.max(1, Math.min(n, totalPages))
      render()
    }

    document.getElementById('searchInput').addEventListener('input', function() {
      search = this.value
      page = 1
      render()
    })

    var exportingId = null

    function openExportModal(id) {
      exportingId = id
      document.getElementById('exportModal').style.display = ''
    }

    function closeExportModal() {
      document.getElementById('exportModal').style.display = 'none'
      exportingId = null
    }

    function doExport() {
      const format = document.querySelector('input[name="exportFormat"]:checked').value
      const item = mockData.find(r => r.id === exportingId)
      if (!item) {
        alert('未找到合同信息')
        return
      }

      // 检查 docx 库是否加载
      if (typeof docx === 'undefined') {
        alert('文档库未加载，请刷新页面重试')
        console.error('docx library not loaded')
        return
      }

      const { Document, Packer, Paragraph, TextRun, HeadingLevel, AlignmentType } = docx

      if (format === 'original') {
        // 原始文档
        const doc = new Document({
          sections: [{
            properties: {},
            children: [
              new Paragraph({ text: '原始合同文档', heading: HeadingLevel.TITLE, alignment: AlignmentType.CENTER }),
              new Paragraph({ text: '' }),
              new Paragraph({ children: [new TextRun({ text: '合同编号：', bold: true }), new TextRun(item.id)] }),
              new Paragraph({ children: [new TextRun({ text: '合同名称：', bold: true }), new TextRun(item.name)] }),
              new Paragraph({ children: [new TextRun({ text: '合同类型：', bold: true }), new TextRun(item.type)] }),
              new Paragraph({ children: [new TextRun({ text: '合同金额：', bold: true }), new TextRun(item.amount === '-' ? '未约定' : '¥' + item.amount)] }),
              new Paragraph({ text: '' }),
              new Paragraph({ text: '合同正文', heading: HeadingLevel.HEADING_1, alignment: AlignmentType.CENTER }),
              new Paragraph({ text: '' }),
              new Paragraph({ children: [new TextRun({ text: '甲方：', bold: true }), new TextRun('XX科技有限公司')] }),
              new Paragraph({ children: [new TextRun({ text: '乙方：', bold: true }), new TextRun('YY设备制造有限公司')] }),
              new Paragraph({ text: '' }),
              new Paragraph({ text: '鉴于甲方需要采购相关设备，双方经友好协商，达成如下协议：' }),
              new Paragraph({ text: '' }),
              new Paragraph({ text: '第一条 合同标的', heading: HeadingLevel.HEADING_2 }),
              new Paragraph({ text: '甲方同意向乙方购买，乙方同意向甲方出售本合同附件所列设备。' }),
              new Paragraph({ text: '' }),
              new Paragraph({ text: '第二条 合同金额', heading: HeadingLevel.HEADING_2 }),
              new Paragraph({ text: `本合同总金额为人民币${item.amount === '-' ? '（待定）' : item.amount + '元'}（含税）。` }),
              new Paragraph({ text: '' }),
              new Paragraph({ text: '第三条 交付期限', heading: HeadingLevel.HEADING_2 }),
              new Paragraph({ text: '乙方应在合同生效后60个自然日内完成交付。' }),
              new Paragraph({ text: '' }),
              new Paragraph({ text: '第四条 验收标准', heading: HeadingLevel.HEADING_2 }),
              new Paragraph({ text: '甲方应在收到货物后7个工作日内完成验收。' }),
              new Paragraph({ text: '' }),
              new Paragraph({ text: '第五条 质量保证', heading: HeadingLevel.HEADING_2 }),
              new Paragraph({ text: '乙方对所供设备提供12个月质保服务。' }),
              new Paragraph({ text: '' }),
              new Paragraph({ text: '第六条 付款方式', heading: HeadingLevel.HEADING_2 }),
              new Paragraph({ text: '甲方应在收到乙方发票后30个工作日内支付相应款项。' }),
              new Paragraph({ text: '' }),
              new Paragraph({ text: '第七条 违约责任', heading: HeadingLevel.HEADING_2 }),
              new Paragraph({ text: '任何一方违反本合同约定，应向守约方支付合同总价10%的违约金。' }),
              new Paragraph({ text: '' }),
              new Paragraph({ text: '第八条 保密条款', heading: HeadingLevel.HEADING_2 }),
              new Paragraph({ text: '双方应对本合同内容及履行过程中获知的对方商业秘密承担保密义务。' }),
              new Paragraph({ text: '' }),
              new Paragraph({ text: '第九条 争议解决', heading: HeadingLevel.HEADING_2 }),
              new Paragraph({ text: '因本合同引起的争议，双方应协商解决；协商不成的，提交甲方所在地人民法院诉讼解决。' }),
              new Paragraph({ text: '' }),
              new Paragraph({ text: '第十条 其他', heading: HeadingLevel.HEADING_2 }),
              new Paragraph({ text: '本合同一式两份，双方各执一份，具有同等法律效力。' }),
              new Paragraph({ text: '' }),
              new Paragraph({ text: '' }),
              new Paragraph({ children: [new TextRun({ text: '甲方（盖章）：', bold: true }), new TextRun('XX科技有限公司')] }),
              new Paragraph({ children: [new TextRun({ text: '乙方（盖章）：', bold: true }), new TextRun('YY设备制造有限公司')] }),
              new Paragraph({ children: [new TextRun({ text: '签署日期：', bold: true }), new TextRun(item.time.split(' ')[0])] }),
            ]
          }]
        })
        Packer.toBlob(doc).then(blob => {
          const url = URL.createObjectURL(blob)
          const a = document.createElement('a')
          a.href = url
          a.download = `${item.name}.docx`
