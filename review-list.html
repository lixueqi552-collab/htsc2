<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合同审查 — 智能合同审查</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; background: #f5f5f5; color: #262626; font-size: 15px; line-height: 1.6; }
    a { text-decoration: none; }
  </style>
</head>
<body>
  <script>
    (function() { if (!localStorage.getItem('auth_user')) location.href = 'login.html' })()
    function getAuthUser() { try { return JSON.parse(localStorage.getItem('auth_user')) } catch(e) { return null } }
    function handleLogout() { localStorage.removeItem('auth_user'); location.href = 'login.html' }
    function navTo(path) { location.href = path }
  </script>

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 lg:px-8 sticky top-0 z-50">
    <div class="flex items-center gap-10">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navTo('dashboard.html')">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-[#1677ff] to-[#4096ff] flex items-center justify-center text-white text-sm font-bold shadow-sm">
          <i class="fa-regular fa-file-lines" style="font-size:16px"></i>
        </div>
        <span class="font-semibold text-base text-gray-900">智能合同审查</span>
      </div>
      <nav class="flex items-center gap-1">
        <button onclick="navTo('dashboard.html')" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm transition-colors duration-200 text-gray-500 hover:text-gray-700 hover:bg-gray-50">
          <i class="fa-solid fa-house"></i> 工作台
        </button>
        <button onclick="navTo('review-list.html')" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm transition-colors duration-200 text-[#1677ff] font-semibold bg-blue-50">
          <i class="fa-regular fa-file-lines"></i> 合同审查
        </button>
        <button onclick="navTo('history.html')" class="flex items-center gap-2 px-4 py-2 rounded-lg text-sm transition-colors duration-200 text-gray-500 hover:text-gray-700 hover:bg-gray-50">
          <i class="fa-regular fa-clock"></i> 历史记录
        </button>
      </nav>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2.5 text-sm text-gray-500">
        <div id="userAvatar" class="w-8 h-8 rounded-full bg-[#1677ff] flex items-center justify-center text-white text-xs font-semibold">U</div>
        <span id="userName" class="text-sm text-gray-600">用户</span>
      </div>
      <button onclick="handleLogout()" class="flex items-center gap-1.5 text-xs text-gray-400 hover:text-red-500 transition-colors px-2.5 py-1.5 rounded hover:bg-red-50">
        <i class="fa-solid fa-right-from-bracket"></i> 退出
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-7xl mx-auto w-full px-6 lg:px-8 py-6 lg:py-8">
    <div>
      <div class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-bold text-gray-900">智能审查</h1>
          <p class="text-base text-gray-500 mt-1">管理所有合同审查任务，查看审查报告</p>
        </div>
        <button onclick="navTo('review.html')" class="bg-[#1677ff] text-white px-6 py-3 rounded-lg font-semibold text-base hover:bg-[#0958d9] transition-colors flex items-center gap-2 shadow-sm">
          <i class="fa-solid fa-upload"></i> 上传文档
        </button>
      </div>

      <div class="bg-white rounded-xl border border-gray-100 overflow-hidden">
        <div class="p-4 border-b border-gray-100 flex items-center justify-between">
          <div class="relative w-80">
            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="搜索文档名称..." class="w-full pl-9 pr-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-[#1677ff] focus:ring-1 focus:ring-[#1677ff]/20">
          </div>
          <span id="totalCount" class="text-sm text-gray-400">共 8 条记录</span>
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="bg-gray-50 text-left">
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500 w-[140px]">合同编号</th>
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500">审查文档名称</th>
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500 w-[90px]">文档权限</th>
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500 w-[80px]">创建人</th>
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500 w-[80px]">状态</th>
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500 w-[150px]">上传时间</th>
                <th class="py-3.5 px-4 text-sm font-medium text-gray-500 w-[200px]">操作</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-gray-50"></tbody>
          </table>
        </div>

        <div id="tableFooter" class="flex items-center justify-between px-4 py-3 border-t border-gray-100" style="display:none"></div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center py-4 border-t border-gray-100 bg-white">
    <span class="text-xs text-gray-400">智能合同审查系统 &copy; 2026</span>
  </footer>

  <script>
    var u = getAuthUser()
    if (u) { document.getElementById('userName').textContent = u.name; document.getElementById('userAvatar').textContent = u.name[0] }

    const mockData = [
      { id: 'CT-2026-001', name: '设备采购框架协议.pdf', permission: '仅自己', creator: '张明', status: 'completed', time: '2026-05-14 09:30', score: 88 },
      { id: 'CT-2026-002', name: 'IT 运维服务合同.docx', permission: '团队', creator: '李华', status: 'reviewing', time: '2026-05-14 10:15', score: null },
      { id: 'CT-2026-003', name: '保密协议-v3.pdf', permission: '仅自己', creator: '张明', status: 'pending', time: '2026-05-13 16:45', score: null },
      { id: 'CT-2026-004', name: '办公楼租赁协议.pdf', permission: '所有人', creator: '王磊', status: 'risk', time: '2026-05-13 14:20', score: 65 },
      { id: 'CT-2026-005', name: '软件许可及服务协议.pdf', permission: '团队', creator: '李华', status: 'completed', time: '2026-05-12 11:00', score: 92 },
      { id: 'CT-2026-006', name: '货物运输合同.pdf', permission: '仅自己', creator: '张明', status: 'completed', time: '2026-05-11 15:30', score: 78 },
      { id: 'CT-2026-007', name: '技术服务合同.docx', permission: '团队', creator: '赵丽', status: 'pending', time: '2026-05-10 09:00', score: null },
      { id: 'CT-2026-008', name: '年度采购框架协议.pdf', permission: '所有人', creator: '王磊', status: 'completed', time: '2026-05-09 13:45', score: 85 },
    ]

    const statusConfig = {
      completed: { label: '审查完成', class: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-50 text-green-600' },
      reviewing: { label: '审查中', class: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-50 text-blue-600' },
      pending: { label: '待审查', class: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-yellow-50 text-yellow-600' },
      risk: { label: '有风险', class: 'inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-50 text-red-600' },
    }

    const perPage = 6
    let page = 1
    let search = ''

    function render() {
      const kw = search.toLowerCase()
      const filtered = mockData.filter(r => r.name.toLowerCase().includes(kw))
      const totalPages = Math.ceil(filtered.length / perPage)
      const safePage = Math.min(page, Math.max(1, totalPages))
      const paged = filtered.slice((safePage - 1) * perPage, safePage * perPage)

      document.getElementById('totalCount').textContent = '共 ' + filtered.length + ' 条记录'

      const tbody = document.getElementById('tableBody')
      if (paged.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="py-12 text-center text-sm text-gray-400">暂无数据</td></tr>'
      } else {
        tbody.innerHTML = paged.map(r => {
          const info = statusConfig[r.status]
          return `<tr class="hover:bg-gray-50 transition-colors">
            <td class="py-3.5 px-4 text-sm text-gray-600 font-mono">${r.id}</td>
            <td class="py-3.5 px-4"><span class="text-base text-gray-800 font-medium">${r.name}</span></td>
            <td class="py-3.5 px-4 text-sm text-gray-500">${r.permission}</td>
            <td class="py-3.5 px-4 text-sm text-gray-600">${r.creator}</td>
            <td class="py-3.5 px-4"><span class="${info.class}">${info.label}</span></td>
            <td class="py-3.5 px-4 text-sm text-gray-500">${r.time}</td>
            <td class="py-3.5 px-4">
              <div class="flex items-center gap-2">
                <button onclick="navTo('review.html?report=1')" class="flex items-center gap-1 px-3 py-2 rounded text-sm text-[#1677ff] hover:bg-blue-50 transition-colors"><i class="fa-regular fa-eye"></i> 查看</button>
                <button class="flex items-center gap-1 px-3 py-2 rounded text-sm text-gray-500 hover:bg-gray-100 transition-colors"><i class="fa-regular fa-pen-to-square"></i> 编辑</button>
                <button class="flex items-center gap-1 px-3 py-2 rounded text-sm text-red-500 hover:bg-red-50 transition-colors"><i class="fa-regular fa-trash-can"></i> 删除</button>
              </div>
            </td>
          </tr>`
        }).join('')
      }

      const footer = document.getElementById('tableFooter')
      if (totalPages > 1) {
        footer.style.display = ''
        footer.innerHTML = `
          <span class="text-xs text-gray-400">第 ${safePage}/${totalPages} 页</span>
          <div class="flex items-center gap-1">
            <button onclick="goPage(${safePage - 1})" ${safePage === 1 ? 'disabled' : ''} class="p-1.5 rounded border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-30 disabled:cursor-not-allowed"><i class="fa-solid fa-chevron-left" style="font-size:12px"></i></button>
            ${Array.from({length: totalPages}, (_, i) => i + 1).map(p =>
              `<button onclick="goPage(${p})" class="w-7 h-7 rounded text-xs font-medium ${p === safePage ? 'bg-[#1677ff] text-white' : 'text-gray-500 hover:bg-gray-100'}">${p}</button>`
            ).join('')}
            <button onclick="goPage(${safePage + 1})" ${safePage === totalPages ? 'disabled' : ''} class="p-1.5 rounded border border-gray-200 text-gray-500 hover:bg-gray-50 disabled:opacity-30 disabled:cursor-not-allowed"><i class="fa-solid fa-chevron-right" style="font-size:12px"></i></button>
          </div>`
      } else {
        footer.style.display = 'none'
      }
    }

    function goPage(n) {
      const filtered = mockData.filter(r => r.name.toLowerCase().includes(search.toLowerCase()))
      const totalPages = Math.ceil(filtered.length / perPage)
      page = Math.max(1, Math.min(n, totalPages))
      render()
    }

    document.getElementById('searchInput').addEventListener('input', function() {
      search = this.value
      page = 1
      render()
    })

    render()
  </script>
</body>
</html>
